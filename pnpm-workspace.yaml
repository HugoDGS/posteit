packages:
  - apps/*
  - packages/*

# Refuse l'installation si la version de Node ne respecte pas "engines".
engineStrict: true

# Versions partagées : les package.json y renvoient avec "catalog:".
catalog:
  '@eslint/js': 9.39.5
  '@stylistic/eslint-plugin': 6.0.1
  '@types/node': 26.6.6
  eslint: 9.39.5
  eslint-config-prettier: 10.1.8
  eslint-plugin-perfectionist: 5.14.0
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-sonarjs: 4.2.2
  # 66+ exige ESLint 10 : on reste sur la 65 tant qu'on est sur ESLint 9.
  eslint-plugin-unicorn: 65.0.1
  globals: 17.14.0
  # typescript-eslint 8 supporte TypeScript < 6.1.
  typescript: 6.0.3
  typescript-eslint: 8.73.0
