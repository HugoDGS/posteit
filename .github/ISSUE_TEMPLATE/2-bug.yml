name: Bug
description: Un comportement qui ne correspond pas à ce qui est attendu.
title: "[Bug] "
labels: ["type: fix"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui était attendu
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App concernée
      options:
        - front
        - gateway
        - identity
        - offer
        - application
        - profile
        - matching
        - job-runner
        - infra
    validations:
      required: true
