name: Préparer pnpm et Node
description: Installe pnpm (version de packageManager), Node avec le cache du store pnpm, puis les dépendances.

inputs:
  node-version:
    description: Version de Node à installer. Vide, elle est lue dans .nvmrc.
    default: ''
  install:
    description: Lancer pnpm install --frozen-lockfile.
    default: 'true'

runs:
  using: composite
  steps:
    # La version de pnpm est lue dans le champ packageManager de package.json.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        # Sans installation, restaurer le store pnpm ne servirait à rien.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        # Les hooks Git ne servent à rien en CI.
        HUSKY: '0'
