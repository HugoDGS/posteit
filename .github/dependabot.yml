version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    # Une version publiée depuis moins de 7 jours n'est pas proposée : la
    # plupart des versions piratées sont retirées avant. Les correctifs de
    # sécurité ne sont pas retardés.
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
    # Montées bloquées tant que les plugins ne les supportent pas.
    # À retirer, puis à faire dans une PR dédiée, dès que c'est le cas.
    ignore:
      # typescript-eslint 8 exige TypeScript < 6.1 : la 6.1, une mineure,
      # casserait déjà le lint. Les correctifs 6.0.x restent proposés.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # eslint-plugin-react exige ESLint 9 au plus.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # eslint-plugin-unicorn 66 et plus exige ESLint 10.
      - dependency-name: eslint-plugin-unicorn
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    # Les workflows et l'action locale de préparation, épinglés par SHA.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    target-branch: develop
    # Une version publiée depuis moins de 7 jours n'est pas proposée : la
    # plupart des versions piratées sont retirées avant. Les correctifs de
    # sécurité ne sont pas retardés.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
