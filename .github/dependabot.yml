version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    # Les workflows et l'action locale de préparation, épinglés par SHA.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
