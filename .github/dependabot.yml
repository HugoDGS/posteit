version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ['*']
    # Montées majeures bloquées tant que les plugins ne les supportent pas.
    # À retirer, puis à faire dans une PR dédiée, dès que c'est le cas.
    ignore:
      # typescript-eslint 8 exige TypeScript < 6.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-react exige ESLint 9 au plus.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # eslint-plugin-unicorn 66 et plus exige ESLint 10.
      - dependency-name: eslint-plugin-unicorn
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
